<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>V4 Tecnologia Brasil · papel timbrado</title>
<style>

  <div><div style="font-family:Anton;font-size:27px;letter-spacing:1.5px;color:${fg};line-height:1">TECNOLOGIA BRASIL</div>
  <div style="font-size:10px;font-weight:700;letter-spacing:2.6px;color:${GOLD};margin-top:5px">DIGITALGOV · SETOR DE TECNOLOGIA</div></div></div>
 <div class="x" style="left:60px;right:60px;top:134px;height:3px;background:${GOLD}"></div>

 <div class="body">${content}</div>
 <div class="x" style="left:60px;bottom:76px;font-size:9px;font-weight:500;color:${dark ? '#8E8A82' : '#6B675F'}">V4 FábricaGov · CNPJ 24.361.188/0001-61</div>
 <div class="x" style="left:0;right:0;bottom:0;height:64px;background:${GOLD};display:flex;align-items:center;justify-content:space-between;padding:0 60px;font-size:11px;font-weight:700;color:${INK}">
  <span>(31) 99827-7323</span><span>fabricagovv@gmail.com</span><span>@Grupo_v4_fabricagovv</span><span>Alvorada de Minas · MG</span></div></div>`; };
const exemplo = `<p style="text-align:right">Alvorada de Minas, [dia] de [mês] de [ano].</p>
<p><b>Ofício nº [000]/[ano]</b></p>
<p>À<br>[Nome do destinatário]<br>[Cargo]<br>[Órgão ou empresa]</p>
<p><b>Assunto:</b> [assunto do documento]</p>
<p>Prezado(a) Senhor(a),</p>
<p>[Escreva aqui o texto do documento. Este espaço segue as margens do papel timbrado e pode ser usado para ofícios, propostas, contratos e comunicados da V4 Tecnologia Brasil.]</p>
<p>[Segundo parágrafo, se necessário.]</p>
<p>Colocamo-nos à disposição para qualquer esclarecimento.</p>
<p>Atenciosamente,</p>
<p style="margin-top:56px;border-top:1px solid #111216;width:260px;padding-top:6px"><b>Warley Luciano Costa Gomes</b><br>Administrador e Gerente Geral · DigitalGov</p>`;
document.body.insertAdjacentHTML('beforeend', page(true) + page(false) + page(false, exemplo));
document.fonts.ready.then(() => window.ready = true);
</script></body></html>
