 <div class="abs" id="fade" style="inset:0;background:#000;opacity:0;pointer-events:none"></div>

<script src="../kit/kit.js"></script>
<script>
const {$, cl, eo, eio, spr, mul} = K;
const CHROME = 'linear-gradient(115deg,#5B5F68 0%,#F4F5F7 12%,#9EA2AB 24%,#FFFFFF 33%,#6B6F78 45%,#E8EAEE 58%,#8C9099 70%,#FFFFFF 80%,#4C5058 100%)';
const SYS = [['Pesquisa', '#0E8FB5'], ['Saúde', '#1E9E73'], ['Jurídico', '#6D5BE0'], ['Aprendizagem', '#D63E86'], ['Obras', '#E2601A'], ['Engenheiro 7.3', '#2F6BFF']];
let TL, LN, S = {}, MSG = [];
const Wd = (k, w, o = 0) => { const l = LN[k - 1]; const c = l.caption.toLowerCase(); const i = c.indexOf(w.toLowerCase()); return l.start + l.dur * (i < 0 ? 0 : i / c.length) + o; };
function bars(v, col) { return `<div style="display:flex;flex-direction:column;gap:10px;margin-top:6px">${v.map(([n, p]) => `<div style="display:flex;align-items:center;gap:14px;font-size:24px;font-weight:700"><span style="width:180px">${n}</span><div style="flex:1;height:26px;border-radius:13px;background:#E6E4DE;overflow:hidden"><div class="gb" data-p="${p}" style="height:100%;width:0;background:${col}"></div></div><span style="width:70px;text-align:right">${p}%</span></div>`).join('')}</div>`; }
function build() {
  // seções da conversa (cada sistema)
  const L = k => LN[k - 1].start;
  const add = (t, html, cls, sys) => MSG.push([t, html, cls, sys]);
  add(L(3) - .2, 'O que o povo mais pede na Vila Nova?', 'me', 0);

  add(L(4) - .2, 'Vai faltar algum remédio esta semana?', 'me', 1);
  add(L(4) + 1.2, `<b class="hd" style="color:#C77D00">⚠ ALERTA · ESTOQUE</b><div style="font-size:30px;font-weight:800">Dipirona 500 mg · UBS Centro</div><div style="font-size:26px;color:#77736B;font-weight:600;margin-top:4px">acaba em ~5 dias pelo consumo atual</div><div style="height:20px;border-radius:10px;background:#E6E4DE;margin-top:14px;overflow:hidden"><div id="stk" style="height:100%;width:80%;background:#FFB020"></div></div><div style="margin-top:14px;font-size:26px;font-weight:700">💡 Sugestão: remanejar 400 comprimidos da UBS Vila Nova</div><span class="btn" style="background:${SYS[1][1]};color:#FFF">Aprovar remanejamento</span>`, 'ai', 1);
  add(L(5) - .2, 'Que documentos preciso antes de licitar a reforma da escola?', 'me', 2);
  add(L(5) + 1.2, `<b class="hd" style="color:${SYS[2][1]}">JURÍDICO · COM FONTE</b><div style="font-size:27px">Na fase preparatória, o processo deve ter, entre outros:</div><div style="margin-top:6px">${['Estudo técnico preliminar', 'Termo de referência ou projeto básico', 'Orçamento estimado', 'Análise de riscos'].map(c => `<span class="chip">✓ ${c}</span>`).join('')}</div><div style="margin-top:14px;border-left:6px solid ${SYS[2][1]};background:#ECE9FF;padding:12px 16px;font-size:23px;font-weight:700">Lei nº 14.133/2021 · Art. 18 (fase preparatória)</div><div style="margin-top:10px;font-size:22px;color:#C77D00;font-weight:700">● Aguardando revisão do procurador</div>`, 'ai', 2);
  add(L(6) - .2, 'Como está o 5º ano B em matemática?', 'me', 3);
  let hm = ''; const R = mul(8); for (let r = 0; r < 4; r++) { hm += '<div style="display:flex;gap:8px;margin-top:8px">'; for (let c = 0; c < 6; c++) { const v = R(); hm += `<div style="flex:1;height:34px;border-radius:8px;background:${c === 1 && r < 4 && v < .7 ? '#E5484D' : v > .5 ? '#2BD99F' : '#FFD166'}"></div>`; } hm += '</div>'; }
  add(L(6) + 1.2, `<b class="hd" style="color:${SYS[3][1]}">APRENDIZAGEM · TURMA 5º B</b><div style="display:flex;justify-content:space-between;font-size:20px;color:#77736B;font-weight:700"><span>Leitura</span><span>Frações</span><span>Geometria</span><span>Escrita</span><span>Problemas</span><span>Medidas</span></div>${hm}<div style="margin-top:14px;font-size:26px;font-weight:700">4 alunos com dificuldade em frações</div><span class="btn" style="background:${SYS[3][1]};color:#FFF">✓ Trilha de reforço criada</span>`, 'ai', 3);
  add(L(7) - .2, `<div style="display:flex;gap:16px;align-items:center"><svg width="230" height="140" viewBox="0 0 420 250" style="background:#F7FAFF;border-radius:10px"><g stroke="#2F6BFF" stroke-width="3" fill="none"><rect x="20" y="40" width="380" height="60"/><path d="M20 100 L20 190 M400 100 L400 190 M150 100 L150 170 M270 100 L270 170"/><path d="M60 190 C150 230 270 230 360 190" stroke="#3E7FA8"/></g></svg><div><div style="font-size:26px">planta_ponte.pdf</div><div style="font-size:22px;opacity:.7;margin-top:6px">"Quero construir uma ponte aqui."</div></div></div>`, 'me', 4);
  add(L(7) + 1.5, `<b class="hd" style="color:${SYS[4][1]}">OBRAS · PONTE SOBRE O CÓRREGO</b><div class="kv"><span>Vão livre</span><b>18,40 m</b><span>Extensão × largura</span><b>24 × 9 m</b><span>Concreto · aço</span><b>140 m³ · 14 t</b><span>Total estimado (SINAPI)</span><b style="color:${SYS[4][1]}" id="obt">R$ 0</b></div><div style="margin-top:8px">${['ETP', 'TR', 'Projeto básico', 'Cronograma'].map(c => `<span class="chip">📄 ${c}</span>`).join('')}</div><div style="margin-top:10px;font-size:22px;color:#1E9E73;font-weight:700">✓ Engenheiro valida · ART · valores ilustrativos</div>`, 'ai', 4);
  add(L(8) - .2, 'Como está a obra da creche?', 'me', 5);
  add(L(8) + 1.2, `<b class="hd" style="color:${SYS[5][1]}">ENGENHEIRO 7.3 · CRECHE CENTRO</b><svg width="820" height="200" viewBox="0 0 820 200"><g stroke="#E3E1DA"><line x1="0" y1="40" x2="820" y2="40"/><line x1="0" y1="110" x2="820" y2="110"/><line x1="0" y1="180" x2="820" y2="180"/></g><path id="sp" d="M0 190 C200 186 300 120 410 90 C520 60 640 20 820 15" stroke="#A9ADB8" stroke-width="5" stroke-dasharray="12 10" fill="none"/><path id="sr" d="M0 190 C200 188 300 135 410 112" stroke="${SYS[5][1]}" stroke-width="8" fill="none"/></svg><div class="kv"><span>Concluída</span><b>46%</b><span>Previsto para hoje</span><b>52%</b></div><div style="margin-top:12px;background:#FFF4E5;border-left:6px solid #FFB020;padding:12px 16px;font-size:24px;font-weight:700">⚠ Risco de atraso de 6 dias na estrutura · sugestão: reforçar a equipe na semana 31</div>`, 'ai', 5);
  $('list').innerHTML = MSG.map(([t, h, c], i) => `<div class="m ${c}" id="m${i}">${h}</div>`).join('') + `<div class="m ai" id="typ" style="position:absolute;left:30px;width:auto;opacity:0;padding:16px 22px"><span id="dots" style="font-size:36px;letter-spacing:6px;color:#9A968C">•••</span></div>`;
  $('tabs').innerHTML = SYS.map(([n, c], i) => `<div class="tab" id="tb${i}">${n}</div>`).join('');
  $('six0').innerHTML = SYS.map(([n, c], i) => `<div class="chip" id="sx${i}" style="font-size:32px;padding:14px 24px;background:#1A1C22;color:#F4F1EA;border-color:${c}">${n}</div>`).join('');
  // conectado
  let h = ''; const cx = 540, cy = 790; SYS.forEach(([n, c], i) => { const a = -Math.PI / 2 + i * Math.PI / 3; const x = cx + Math.cos(a) * 400, y = cy + Math.sin(a) * 400; h += `<path id="hl${i}" d="M${cx} ${cy} L${x} ${y}" stroke="${c}" stroke-width="6"/><circle id="hp${i}" r="11" fill="${c}"/>`; S['n' + i] = [x, y]; }); $('hub').innerHTML = h;
  $('nodes').innerHTML = SYS.map(([n, c], i) => `<div class="abs" id="nd${i}" style="left:${S['n' + i][0] - 110}px;top:${S['n' + i][1] - 50}px;width:220px;height:100px;border-radius:24px;background:#1A1C22;border:3px solid ${c};display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#F4F1EA;text-align:center">${n}</div>`).join('');
  ['lg0', 'lg9'].forEach(id => { $(id).style.background = CHROME; $(id).style.backgroundSize = '300% 100%'; });
}
function show(n) { ['op', 'ch', 'cn', 'fi'].forEach(x => $(x).style.display = x === n ? 'block' : 'none'); }
function seek(t) {
  const T1 = LN[2].start - .5, T2 = LN[8].start - .4, T3 = LN[9].start - .4;
  const n = t < T1 ? 'op' : t < T2 ? 'ch' : t < T3 ? 'cn' : 'fi'; show(n);
  if (n === 'op') { const w = ['A', 'nova', 'IA', 'para', 'municípios', 'e', 'empresas', 'chegou.']; $('h0').innerHTML = w.map((x, i) => { const u = t - .5 - i * .12; const p = spr(u * 1.5); return `<span style="display:inline-block;margin:0 12px;opacity:${cl(u / .08)};transform:translateY(${60 * (1 - Math.min(1, p))}px) scale(${.6 + .4 * Math.min(1.2, p)});${['IA', 'municípios', 'empresas'].includes(x) ? 'color:#D9A441' : ''}">${x}</span>${[2, 4].includes(i) ? '<br>' : ''}`; }).join('');
    const tl = Wd(1, 'v4.7') - .2; const lp = eo((t - tl) / .6); $('lg0').style.opacity = t < LN[1].start - .3 ? lp : 1 - cl((t - LN[1].start + .3) / .3); $('lg0').style.transform = `scale(${.85 + .15 * lp})`; $('lg0').style.backgroundPosition = `${100 - t * 30}% 0`;
    $('gl0').style.opacity = .5 + .3 * Math.sin(t * 2);
    const t2 = LN[1].start; $('t0').innerHTML = t > t2 - .2 ? '6 sistemas. <span style="color:#D9A441">1 conversa.</span>' : ''; $('t0').style.opacity = cl((t - t2 + .2) / .3);
    for (let i = 0; i < 6; i++) K.pop($('sx' + i), t, Wd(2, 'seis') + i * .12); $('six0').style.display = t > t2 - .2 ? 'flex' : 'none'; $('h0').style.transform = `translateY(${t > t2 - .3 ? -180 * eo((t - t2 + .3) / .5) : 0}px) scale(${t > t2 - .3 ? 1 - .25 * eo((t - t2 + .3) / .5) : 1})`; }
  if (n === 'ch') { $('app').style.transform = `translateY(${80 * (1 - eo((t - T1) / .5))}px)`;
    let si = 0; for (let k = 3; k <= 8; k++) if (t >= LN[k - 1].start - .4) si = k - 3;
    $('sys').textContent = SYS[si][0].toUpperCase(); $('sys').style.color = SYS[si][1];
    SYS.forEach(([nm, c], i) => { const e = $('tb' + i); const on = i === si; e.style.background = on ? c : '#FFF'; e.style.color = on ? '#FFF' : '#8A8780'; e.style.borderColor = on ? c : '#E4E2DC'; });
    $('tabs').style.transform = `translateX(${-Math.max(0, si - 2) * 170 * 1}px)`;
    MSG.forEach(([t0], i) => { const e = $('m' + i); const p = eo((t - t0) / .35); e.style.opacity = cl((t - t0) / .15); e.style.transform = `translateY(${24 * (1 - p)}px) scale(${.96 + .04 * p})`; });
    const H = $('msgs').clientHeight, bot = i => { const e = $('m' + i); return e.offsetTop + e.offsetHeight; };
    const EV = [[0, 0]]; MSG.forEach(([t0, , c], i) => { if (c === 'ai') EV.push([t0 - .8, bot(i - 1) + 20 + 76]); EV.push([t0, bot(i)]); });
    let ci = 0; EV.forEach((e, i) => { if (t >= e[0]) ci = i; }); const tg = v => Math.max(0, v + 28 - H); const cur = tg(EV[ci][1]), prv = tg(EV[Math.max(0, ci - 1)][1]); const sy = prv + (cur - prv) * eo((t - EV[ci][0]) / .45);
    $('list').style.transform = `translateY(${-sy}px)`;
    const tp = $('typ'); let ty = -1; MSG.forEach(([t0, , c], i) => { if (c === 'ai' && t > t0 - .8 && t < t0) ty = i; }); tp.style.opacity = ty > 0 ? 1 : 0; if (ty > 0) { tp.style.top = (bot(ty - 1) + 20) + 'px'; $('dots').style.opacity = .5 + .5 * Math.abs(Math.sin(t * 6)); }
    document.querySelectorAll('.gb').forEach(b => { b.style.width = (+b.dataset.p * 2.2 * eo((t - MSG[1][0] - .2) / .8)) + '%'; });
    $('stk').style.width = (80 - 62 * eo((t - MSG[3][0] - .2) / 1.4)) + '%';
    $('obt').textContent = 'R$ ' + Math.round(340060 * eo((t - MSG[9][0] - .3) / 1.2)).toLocaleString('pt-BR');
    const sp = $('sp'), sr = $('sr'); [sp, sr].forEach((p, j) => { const L = p.getTotalLength(); p.style.strokeDasharray = j ? L : '12 10'; if (j) p.style.strokeDashoffset = L * (1 - eio((t - MSG[11][0] - .2) / .9)); }); }
  if (n === 'cn') { const lt = t - T2; K.pop($('core'), t, T2 + .1); SYS.forEach((s, i) => { const p = $('hl' + i); const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L * (1 - eo((lt - .2 - i * .08) / .4)); K.pop($('nd' + i), t, T2 + .4 + i * .08); const u = (lt * .8 + i * .17) % 1; const q = p.getPointAtLength(L * u); $('hp' + i).setAttribute('cx', q.x); $('hp' + i).setAttribute('cy', q.y); });
