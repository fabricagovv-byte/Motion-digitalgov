<script>
const {$, cl, eo, eio, spr, mul} = K;
const ORD = ['hk', 'dr', 'or', 'ch', 'dc', 'pv'];
const C = [0, 2.2, 4.6, 6.6, 24.0, 26.0, 28.2];
const DUR = C[6];

// mensagens do chat: [tempo de entrada (s no filme), html, classe]
const MSG = [];
const QT = [['Concreto fck 30 MPa', '140 m³', 620, 140], ['Aço CA-50', '14.000 kg', 9.8, 14000], ['Formas de madeira', '520 m²', 95, 520], ['Estacas (16 × 12 m)', '192 m', 210, 192], ['Guarda-corpo', '48 m', 380, 48], ['Aterro das cabeceiras', '180 m³', 45, 180]];
const TOTAL = QT.reduce((a, q) => a + q[2] * q[3], 0);
const brl = v => 'R$ ' + Math.round(v).toLocaleString('pt-BR');
function river(sc, ox, oy) {   // vista aérea ilustrada: córrego atravessando o terreno, com as duas margens
  const P = (x, y) => `${ox + x * sc} ${oy + y * sc}`;
  let s = `<rect x="${ox - 40 * sc}" y="${oy - 25 * sc}" width="${110 * sc}" height="${70 * sc}" fill="#6F8A4E"/>`;
  for (let i = 0; i < 90; i++) { const r = Math.abs(Math.sin(i * 12.9898) * 43758.5453 % 1), q = Math.abs(Math.sin(i * 78.233) * 12345.678 % 1); s += `<circle cx="${ox + (r * 110 - 40) * sc}" cy="${oy + (q * 70 - 25) * sc}" r="${(1 + r * 2.4) * sc}" fill="#5E7A40" opacity=".7"/>`; }
  s += `<path d="M${P(-40, 12)} C${P(-10, 6)} ${P(5, 16)} ${P(10, 2)} C${P(14, -8)} ${P(30, -6)} ${P(32, -25)} L${P(52, -25)} C${P(48, -4)} ${P(32, -2)} ${P(29, 12)} C${P(25, 26)} ${P(5, 22)} ${P(-40, 34)}Z" fill="#9C8F6A"/>`;
  s += `<path d="M${P(-40, 16)} C${P(-10, 10)} ${P(8, 18)} ${P(13, 4)} C${P(17, -6)} ${P(32, -4)} ${P(36, -25)} L${P(47, -25)} C${P(43, -2)} ${P(29, 0)} ${P(26, 12)} C${P(22, 23)} ${P(5, 19)} ${P(-40, 29)}Z" fill="#3E7FA8"/>`;
  s += `<rect x="${ox - 40 * sc}" y="${oy + 2 * sc}" width="${30 * sc}" height="${5 * sc}" fill="#4A4C52" transform="rotate(-8 ${ox} ${oy})"/><rect x="${ox + 40 * sc}" y="${oy + 7 * sc}" width="${30 * sc}" height="${5 * sc}" fill="#4A4C52"/>`;
  [[-25, -15], [-30, 25], [40, 25], [55, -12], [60, 30], [-10, -20]].forEach(([x, y]) => s += `<circle cx="${ox + x * sc}" cy="${oy + y * sc}" r="${3.4 * sc}" fill="#3F6B35"/><circle cx="${ox + (x - 1) * sc}" cy="${oy + (y - 1) * sc}" r="${1.7 * sc}" fill="#5A8A47"/>`);
  return s; }
function iso(x, y, z, ox, oy, s) { return [ox + (x - y) * s * .866, oy + (x + y) * s * .5 - z * s]; }
function bridge(lt, ox, oy, s) {   // ponte isométrica que se monta peça por peça
  const g = t0 => eo((lt - t0) / .35); const Q = (x, y, z) => iso(x, y, z, ox, oy, s).join(' ');
  const box = (x0, y0, z0, w, d, h, top, l, r, op) => `<g opacity="${op}"><path d="M${Q(x0, y0 + d, z0)} L${Q(x0 + w, y0 + d, z0)} L${Q(x0 + w, y0 + d, z0 + h)} L${Q(x0, y0 + d, z0 + h)}Z" fill="${l}"/><path d="M${Q(x0 + w, y0, z0)} L${Q(x0 + w, y0 + d, z0)} L${Q(x0 + w, y0 + d, z0 + h)} L${Q(x0 + w, y0, z0 + h)}Z" fill="${r}"/><path d="M${Q(x0, y0, z0 + h)} L${Q(x0 + w, y0, z0 + h)} L${Q(x0 + w, y0 + d, z0 + h)} L${Q(x0, y0 + d, z0 + h)}Z" fill="${top}"/></g>`;
  let o = box(-4, -2, -1, 8, 13, 1, '#7FA35E', '#5E7A40', '#4E6A35', 1) + box(20, -2, -1, 8, 13, 1, '#7FA35E', '#5E7A40', '#4E6A35', 1);
  o += `<path d="M${Q(4, -2, -.6)} L${Q(20, -2, -.6)} L${Q(20, 11, -.6)} L${Q(4, 11, -.6)}Z" fill="#3E7FA8"/>`;
  o += box(2, 0, -1, 3, 9, 3.6 * g(.1), '#C9C5BA', '#A8A397', '#8F8A7E', g(.1)) + box(19, 0, -1, 3, 9, 3.6 * g(.1), '#C9C5BA', '#A8A397', '#8F8A7E', g(.1));
  [9, 15].forEach((x, i) => o += box(x, 3.5, -1, 1, 2, 3.6 * g(.4 + i * .1), '#BDB8AC', '#9E998D', '#888376', g(.4 + i * .1)));
  const dk = g(.8); o += box(2, 0, 2.6, 20 * dk, 9, .6, '#D8D4CA', '#B3AEA2', '#9C978B', dk);
  if (dk > .9) { o += `<path d="M${Q(2, 1.5, 3.21)} L${Q(22, 1.5, 3.21)} M${Q(2, 7.5, 3.21)} L${Q(22, 7.5, 3.21)}" stroke="#FFF" stroke-width="3" stroke-dasharray="10 8"/>`; }
  const rl = g(1.2); [0, 8.8].forEach(y => { for (let x = 2; x <= 22 * rl; x += 2) o += `<path d="M${Q(x, y, 3.2)} L${Q(x, y, 4.1)}" stroke="#FF7A2F" stroke-width="3"/>`; o += `<path d="M${Q(2, y, 4.1)} L${Q(2 + 20 * rl, y, 4.1)}" stroke="#FF7A2F" stroke-width="4" opacity="${rl}"/>`; });
  return o; }
function build() {
  $('map1').innerHTML = river(16, 900, 520); $('map2').innerHTML = river(22, 880, 520);
  let d = ''; for (let i = 0; i < 4; i++) d += `<g transform="rotate(${45 + i * 90})"><rect x="-14" y="-110" width="28" height="110" rx="10" fill="#E9EBF0"/><circle cy="-130" r="62" fill="#C9CDD6" opacity=".35" class="rot"/><circle cy="-130" r="10" fill="#2A2C33"/></g>`;
  $('drone1').innerHTML = `<ellipse cx="30" cy="40" rx="150" ry="150" fill="#000" opacity=".25"/>${d}<rect x="-60" y="-50" width="120" height="100" rx="30" fill="#F4F5F7"/><rect x="-40" y="-30" width="80" height="60" rx="18" fill="#2A2C33"/><circle cx="0" cy="40" r="16" fill="#111216" stroke="#FF7A2F" stroke-width="5"/>`;

  const plan = `<svg width="420" height="250" viewBox="0 0 420 250" style="display:block;border-radius:12px;background:#F7FAFF"><g stroke="#2F6BFF" stroke-width="2" fill="none"><rect x="20" y="40" width="380" height="60"/><path d="M20 100 L20 190 M400 100 L400 190 M150 100 L150 170 M270 100 L270 170 M20 190 L60 190 M360 190 L400 190"/><path d="M60 190 C150 230 270 230 360 190" stroke="#3E7FA8"/><path d="M20 30 L400 30 M20 24 L20 36 M400 24 L400 36"/></g><text x="210" y="22" fill="#2F6BFF" font-size="16" font-family="Inter" text-anchor="middle">24,00 m</text><text x="210" y="75" fill="#2F6BFF" font-size="16" font-family="Inter" text-anchor="middle">TABULEIRO</text></svg>`;
  MSG.push([7.0, `<div style="display:flex;gap:18px;align-items:center">${plan}<div><div style="font-size:26px;font-weight:700">planta_ponte.pdf</div><div style="font-size:20px;opacity:.6;margin-top:6px">2 páginas · 1,8 MB</div></div></div>`, 'me', 'doc']);
  MSG.push([7.9, `<div style="display:flex;align-items:center;gap:16px"><div style="width:52px;height:52px;border-radius:50%;background:#FF7A2F;display:flex;align-items:center;justify-content:center;font-size:24px">▶</div><svg id="vw" width="380" height="60"></svg><span style="font-size:22px;opacity:.7">0:02</span></div><div id="tr" style="margin-top:10px;font-size:28px;font-weight:600"></div>`, 'me', 'voz']);
  MSG.push([10.6, `<b class="hd">MEDIDAS DO LOCAL · DRONE + PLANTA</b><div class="kv"><span>Vão livre sobre o córrego</span><b>18,40 m</b><span>Extensão total</span><b>24,00 m</b><span>Largura (2 faixas + passeio)</span><b>9,00 m</b><span>Altura livre até a água</span><b>3,50 m</b></div>`, 'ai', 'med']);
  MSG.push([12.8, `<b class="hd">PRÉVIA 3D</b><svg id="br3d" width="760" height="330"></svg>`, 'ai', '3d']);
  MSG.push([15.0, `<b class="hd">O QUE PRECISA</b><div>${['Concreto armado', 'Aço CA-50', 'Estacas', 'Formas', 'Guarda-corpo', 'Aterro das cabeceiras', 'Drenagem'].map(c => `<span class="chip">▣ ${c}</span>`).join('')}</div>`, 'ai', 'mat']);
  MSG.push([16.8, `<b class="hd">EQUIPAMENTOS</b><div>${[['🏗️', 'Guindaste'], ['🚛', 'Caminhão betoneira'], ['🚜', 'Retroescavadeira'], ['⚙️', 'Bate-estaca'], ['🪜', 'Escoramento']].map(([e, c]) => `<span class="chip">${e} ${c}</span>`).join('')}</div>`, 'ai', 'eq']);
  MSG.push([18.6, `<b class="hd">PLANILHA · QUANTITATIVOS E PREÇOS (REF. SINAPI)</b><table class="q"><tr><th>ITEM</th><th>QTD.</th><th style="text-align:right">PREÇO UNIT.</th><th style="text-align:right">TOTAL</th></tr>${QT.map((q, i) => `<tr><td>${q[0]}</td><td>${q[1]}</td><td class="n" id="pu${i}"></td><td class="n" id="pt${i}"></td></tr>`).join('')}<tr><td colspan="3" style="font-weight:800">Total estimado</td><td class="n" id="ptt" style="color:#E2601A;font-size:26px"></td></tr></table><div style="font-size:18px;color:#9A968C;margin-top:6px">valores ilustrativos</div>`, 'ai', 'tab']);
  MSG.push([21.8, `<b class="hd">DOCUMENTOS PRONTOS</b><div>${['Estudo Técnico Preliminar', 'Termo de Referência', 'Projeto básico', 'Memorial descritivo', 'Planilha orçamentária', 'Cronograma'].map(c => `<span class="chip">📄 ${c}</span>`).join('')}</div><div style="margin-top:14px;display:inline-block;background:#111216;color:#FFF;border-radius:14px;padding:14px 22px;font-size:24px;font-weight:700">⬇ Baixar pacote completo</div>`, 'ai', 'docs']);
  $('list').innerHTML = MSG.map(([t, h, c, id], i) => `<div class="m ${c}" id="m${i}" data-id="${id}">${h}</div>`).join('') + `<div class="m ai" id="typ" style="position:absolute;left:34px;opacity:0;padding:16px 22px"><span id="dots" style="font-size:34px;letter-spacing:6px;color:#9A968C">•••</span></div>`;
  let w = ''; for (let i = 0; i < 38; i++) w += `<rect id="vw${i}" x="${i * 10}" y="20" width="5" height="20" rx="2.5" fill="#FFFFFF"/>`; $('vw').innerHTML = w;
  let pk = ''; ['Projeto básico', 'Memorial descritivo', 'Planilha orçamentária', 'Cronograma', 'Termo de Referência', 'Estudo Técnico Preliminar'].forEach((n, i) => pk += `<div class="doc" id="pk_${i}" style="left:740px;top:110px"><div style="font-size:16px;font-weight:700;color:#E2601A;letter-spacing:3px">PONTE SOBRE O CÓRREGO · VOLUME ÚNICO</div><h4>${n}</h4><i></i><i style="width:80%"></i><i></i><i style="width:65%"></i><i></i><i style="width:75%"></i></div>`); $('pk').innerHTML = pk;
  $('lg').style.background = CHROME; $('lg').style.backgroundSize = '300% 100%';
}
function show(n) { ORD.forEach(x => $(x).style.display = x === n ? 'block' : 'none'); }
function cap(id, lt, d) { const e = $(id); e.style.opacity = cl((lt - .25) / .2) * (1 - cl((lt - d + .15) / .15)); e.style.transform = `translateY(${14 * (1 - eo((lt - .25) / .3))}px)`; }
const CAPS = [[6.6, 'Manda <span>a planta.</span>'], [7.8, 'Fala <span>o que quer.</span>'], [10.4, 'A IA <span>mede.</span>'], [12.6, 'Mostra <span>em 3D.</span>'], [14.8, 'Diz <span>o que precisa.</span>'], [16.6, 'Lista <span>os equipamentos.</span>'], [18.4, 'Faz quantitativos <span>e preços.</span>'], [21.6, 'E entrega <span>os documentos.</span>']];
function seek(t) {
  let i0 = 0; for (let i = 0; i < 6; i++) if (t >= C[i]) i0 = i; const n = ORD[i0]; show(n); const lt = t - C[i0], d = C[i0 + 1] - C[i0];
  if (n === 'hk') { const w = ['E', 'se', 'uma', 'ponte', 'começasse', 'com', 'uma', 'mensagem?']; $('hk1').innerHTML = w.map((x, i) => { const u = lt - .1 - i * .1; const p = spr(u * 1.6); return `<span style="display:inline-block;margin:0 12px;opacity:${cl(u / .08)};transform:translateY(${60 * (1 - Math.min(1, p))}px) scale(${.6 + .4 * Math.min(1.2, p)});${x === 'ponte' || x === 'mensagem?' ? 'color:#FF7A2F' : ''}">${x}</span>${i === 3 ? '<br>' : ''}`; }).join(''); }
  if (n === 'dr') { const p = lt / d; const x = 300 + 1300 * eio(p), y = 520 + 120 * Math.sin(p * 6); $('drone1').style.transform = `translate(${x - 210}px,${y - 210}px) rotate(${Math.sin(p * 6) * 12}deg) scale(.55)`; $('drone1').querySelectorAll('.rot').forEach(e => e.style.opacity = .2 + .2 * Math.abs(Math.sin(t * 40)));
    let ps = ''; for (let q = 0; q < 60; q++) { const pp = p - q * .01; if (pp < 0) break; ps += `<circle cx="${300 + 1300 * eio(pp)}" cy="${520 + 120 * Math.sin(pp * 6)}" r="4" fill="#FF7A2F" opacity="${1 - q / 60}"/>`; } $('path1').innerHTML = ps;
    $('map1').style.transform = `scale(${1.2 - .15 * eio(p)})`; $('map1').style.transformOrigin = '50% 50%'; $('hud1').innerHTML = `ALT 50 m · VOO AUTOMÁTICO<br>FOTOS ${String(Math.round(p * 96)).padStart(3, '0')} · LEVANTAMENTO DAS MARGENS`; cap('c1', lt, d); }
  if (n === 'or') { $('map2').style.transform = `scale(${1.08 - .08 * eo(lt / d)})`; $('map2').style.transformOrigin = '50% 50%';
    const a = cl((lt - .3) / .3), b = cl((lt - .8) / .3), c = cl((lt - 1.2) / .3);
    $('dim2').innerHTML = `<g opacity="${a}"><path d="M740 610 L1060 400" stroke="#FFF" stroke-width="5" stroke-dasharray="14 10"/><circle cx="740" cy="610" r="12" fill="#FF7A2F"/><circle cx="1060" cy="400" r="12" fill="#FF7A2F"/><rect x="820" y="440" width="220" height="62" rx="14" fill="#111216"/><text x="930" y="482" fill="#FF7A2F" font-size="32" font-weight="800" font-family="Inter" text-anchor="middle">18,40 m</text></g>
      <g opacity="${b}"><rect x="1180" y="560" width="300" height="62" rx="14" fill="#111216"/><text x="1330" y="602" fill="#FFF" font-size="28" font-weight="700" font-family="Inter" text-anchor="middle">margem 3,5 m</text></g>
      <g opacity="${c}"><rect x="460" y="300" width="330" height="62" rx="14" fill="#FF7A2F"/><text x="625" y="342" fill="#111216" font-size="28" font-weight="800" font-family="Inter" text-anchor="middle">travessia: 24,0 m</text></g>`;
    $('dim2').style.transform = $('map2').style.transform; $('dim2').style.transformOrigin = '50% 50%'; cap('c2', lt, d); }
