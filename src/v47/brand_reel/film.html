<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>V4.7 · reel de identidade (v2, fiel à referência)</title>
<link rel="stylesheet" href="../kit/kit.css">
<style>
#stage{background:#000}
.sc{display:none;position:absolute;inset:0;overflow:hidden}
.ic{position:absolute;overflow:visible}
.lm{position:absolute;-webkit-mask:url(../kit/assets/nova/v47_logo_branca_transp.png) 0 0/100% 100% no-repeat;mask:url(../kit/assets/nova/v47_logo_branca_transp.png) 0 0/100% 100% no-repeat}
.card{position:absolute;border-radius:22px;padding:26px 28px;font-family:Inter;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 24px 50px #0002}
.card b{font-size:28px;font-weight:600}.card span{font-size:20px;font-weight:500;opacity:.7}
.nav{position:absolute;display:flex;align-items:center;font-family:Inter;font-size:24px;font-weight:500;color:#111216}
</style>
</head>
<body>
<div id="stage">
 <div class="sc" id="s1"></div>
 <div class="sc" id="s2"><div class="abs" id="bg2" style="inset:-30%;background:linear-gradient(100deg,#000 20%,#0A1D7A 42%,#1E60FF 50%,#6FE3FF 56%,#0A1D7A 64%,#000 80%)"></div></div>
 <div class="sc" id="s3" style="background:#FFFFFF"><div class="abs" style="left:-50%;width:200%;top:600px;height:900px;perspective:700px"><div id="fl3" style="position:absolute;inset:0;background-image:linear-gradient(#11121614 2px,transparent 2px),linear-gradient(90deg,#11121614 2px,transparent 2px);background-size:150px 150px;transform:rotateX(74deg);transform-origin:50% 0"></div></div><div class="abs" style="left:0;right:0;top:0;height:640px;background:linear-gradient(#FFF 60%,#FFF0)"></div></div>
 <div class="sc" id="s4" style="background:radial-gradient(80% 90% at 70% 40%,#5A5C62,#1E1F23 70%)"><div class="lm" id="big4" style="left:880px;top:180px;width:2200px;height:920px;background:linear-gradient(160deg,#2B2D33,#0E0F12 60%,#3A3D45)"></div></div>
 <div class="sc" id="s5" style="background:#000"><svg class="abs" id="vec5" width="1920" height="1080"></svg><svg class="abs" id="cur5" width="58" height="58" viewBox="0 0 44 44"><path d="M4 2 L4 34 L13 26 L19 40 L25 37 L19 24 L31 24Z" fill="#E6E8EE" stroke="#000" stroke-width="2"/></svg></div>
 <div class="sc" id="s6" style="background:#1336D9"><div class="abs" id="mark6" style="left:0;top:0"></div><div class="lm" id="wm6" style="background:#FFFFFF"></div><div id="smile6" class="abs"></div><div id="pat6" class="abs" style="inset:-10%"></div>
  <svg class="abs" id="blob6" width="1920" height="1080"></svg></div>
 <div class="sc" id="s7" style="background:radial-gradient(90% 55% at 50% 0%,#C8CCD6 0%,#3B3E46 30%,#0B0C0F 70%)"></div>
 <div class="sc" id="s8" style="background:#FFFFFF">
  <div class="card" id="k8a" style="width:200px;height:230px;background:#2EC4E6;color:#111216"><b>Ciano</b><span>#2EC4E6</span></div>
  <div class="card" id="k8b" style="width:170px;height:200px;background:#FFFFFF;color:#111216;border:1px solid #EEE"><b>Creme</b><span>#F4F1EA</span></div>
  <div class="card" id="k8c" style="width:190px;height:200px;background:#111216;color:#F4F1EA"><b>Grafite</b><span>#111216</span></div>
  <div class="card" id="k8d" style="width:320px;height:300px;background:#1336D9;color:#FFFFFF"><b style="font-size:40px">Azul Cobalto</b><span>#1336D9</span></div>
  <div class="card" id="k8e" style="width:180px;height:180px;background:#D9A441;color:#111216"><b>Dourado</b><span>#D9A441</span></div>
 </div>
 <div class="sc" id="s9" style="background:#FFFFFF"></div>
 <div class="sc" id="s10" style="background:radial-gradient(#26282E,#0A0B0D 75%)"></div>
 <div class="sc" id="s11" style="background:#FFFFFF"><div id="row11" class="abs" style="display:flex;align-items:center;gap:60px"></div></div>
 <div class="sc" id="s12" style="background:#EEEEEC">
  <div class="abs" id="site12" style="left:140px;top:120px;width:1640px;height:1200px;background:#FFFFFF;border-radius:44px;box-shadow:0 30px 80px #0001;overflow:hidden;transform-origin:15% 15%">
   <div class="nav" style="left:80px;right:80px;top:56px"><div id="nm12"></div><div class="lm" style="position:relative;width:130px;height:54px;background:#111216;margin-left:16px"></div><div style="flex:1"></div><span style="margin-left:40px">Início</span><span style="margin-left:40px">Sistemas</span><span style="margin-left:40px">Cidades</span><span style="margin-left:40px">Contato</span></div>
   <div class="abs" id="h12" style="left:80px;top:300px;width:1300px;font-family:Inter;font-weight:500;font-size:104px;line-height:1.1;letter-spacing:-3px;color:#111216"></div>
  </div>
 </div>
 <div class="abs" id="fade" style="inset:0;background:#000;opacity:0;pointer-events:none"></div>
</div>
<script src="../kit/kit.js"></script>
<script>
const {$, cl, eo, eio, spr, mul} = K;
// cortes (s), copiando o ritmo da referência
const C = {s1: 0, s2: .55, s3: .85, s4: 1.75, s5: 2.0, s6: 3.75, s7: 9.2, s8: 10.8, s9: 13.2, s10: 14.2, s11: 14.8, s12: 15.3, end: 18.2};
const DUR = C.end;
// ícone V4.7: quadrado arredondado + esfera dourada (o ponto da logo)
let IC = 0;
function icon(style, size) {
  const id = 'g' + (IC++); const s = size;
  const ringFill = {glass: `url(#${id}gl)`, white: '#FFFFFF', chrome: `url(#${id}ch)`, black: '#111216', knit: `url(#${id}kn)`}[style];
  const dot = {glass: `url(#${id}dg)`, white: '#FFFFFF', chrome: `url(#${id}dg)`, black: '#111216', knit: `url(#${id}kd)`}[style];
  return `<svg class="ic" width="${s}" height="${s}" viewBox="-120 -120 240 240"><defs>
   <linearGradient id="${id}gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8F6FF"/><stop offset=".35" stop-color="#5BB6FF"/><stop offset=".6" stop-color="#1E60FF"/><stop offset="1" stop-color="#A8E4FF"/></linearGradient>
   <linearGradient id="${id}ch" x1="0" y1="0" x2="1" y2="1" class="chg"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".18" stop-color="#8E929B"/><stop offset=".32" stop-color="#F7F8FA"/><stop offset=".5" stop-color="#4E525A"/><stop offset=".66" stop-color="#E9EBEF"/><stop offset=".82" stop-color="#7C808A"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
   <radialGradient id="${id}dg" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFF4D2"/><stop offset=".3" stop-color="#F2C76B"/><stop offset=".7" stop-color="#C08A2A"/><stop offset="1" stop-color="#6B4708"/></radialGradient>
   <pattern id="${id}kn" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#1E4BFF"/><path d="M0 5 Q2.5 0 5 5 T10 5" stroke="#5C86FF" stroke-width="2.2" fill="none"/><path d="M0 9 Q2.5 4 5 9 T10 9" stroke="#0B2BB8" stroke-width="1.6" fill="none"/></pattern>
   <pattern id="${id}kd" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#D9A441"/><circle cx="4" cy="4" r="2" fill="#F2C76B"/></pattern></defs>
   <path d="M-62 -100 H62 A38 38 0 0 1 100 -62 V62 A38 38 0 0 1 62 100 H-62 A38 38 0 0 1 -100 62 V-62 A38 38 0 0 1 -62 -100 Z M-40 -64 A24 24 0 0 0 -64 -40 V40 A24 24 0 0 0 -40 64 H40 A24 24 0 0 0 64 40 V-40 A24 24 0 0 0 40 -64 Z" fill="${ringFill}" fill-rule="evenodd" ${style === 'glass' ? 'opacity=".92"' : ''}/>
   ${style === 'glass' || style === 'chrome' ? '<path d="M-62 -100 H62 A38 38 0 0 1 100 -62" stroke="#FFFFFF" stroke-width="5" fill="none" opacity=".8"/>' : ''}
   <circle cx="0" cy="0" r="30" fill="${dot}"/>${style === 'glass' || style === 'chrome' ? '<circle cx="-10" cy="-11" r="8" fill="#FFFFFF" opacity=".75"/>' : ''}</svg>`;
}
function place(host, html, x, y, s) { host.insertAdjacentHTML('beforeend', `<div class="abs hold" style="left:${x - s / 2}px;top:${y - s / 2}px;width:${s}px;height:${s}px">${html}</div>`); return host.lastElementChild; }
let E = {}, CT;
function build(ct) {
  CT = ct;
  E.sph1 = place($('s1'), `<svg width="160" height="160" viewBox="-60 -60 120 120"><defs><radialGradient id="sp1" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".25" stop-color="#FFE7A8"/><stop offset=".6" stop-color="#D9A441"/><stop offset="1" stop-color="#5A3C06"/></radialGradient></defs><circle r="50" fill="url(#sp1)"/></svg>`, 960, 540, 160);
  E.sph2 = place($('s2'), $('s1').querySelector('.hold').innerHTML.replace('sp1', 'sp2').replace('sp1', 'sp2'), 960, 540, 160);
  E.ic3 = place($('s3'), icon('glass', 420), 960, 470, 420); E.sh3 = place($('s3'), '<div style="width:100%;height:100%;border-radius:50%;background:#1E60FF33;filter:blur(18px)"></div>', 960, 790, 300); E.sh3.style.height = '40px';
  // vetor
  const k = 1700 / ct.w; let s = '<defs><linearGradient id="vf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A2C33"/><stop offset=".5" stop-color="#121317"/><stop offset="1" stop-color="#3B3E46"/></linearGradient></defs><g id="vg">';
  ct.shapes.forEach((sh, i) => s += `<path id="vp${i}" d="M${sh.d.map(p => (p[0] * k).toFixed(1) + ' ' + (p[1] * k).toFixed(1)).join(' L')} Z" fill="url(#vf)" stroke="#D7DBE6" stroke-width="2.5"/>`);
  ct.shapes.forEach((sh, i) => sh.a.forEach((p, j) => { const x = p[0] * k, y = p[1] * k; s += j % 3 === 1 ? `<circle class="anc" cx="${x}" cy="${y}" r="9" fill="none" stroke="#2F7BFF" stroke-width="3"/>` : `<rect class="anc" x="${x - 8}" y="${y - 8}" width="16" height="16" fill="#2F7BFF"/>`; }));
  s += '</g>'; $('vec5').innerHTML = s; CT.k = k;
  // azul: ícone + logo
  E.ic6 = place($('mark6'), icon('white', 120), 0, 0, 120); E.ic6.style.left = '0px'; E.ic6.style.top = '0px';
  $('smile6').innerHTML = `<div class="abs" id="eL" style="left:-130px;top:-90px;width:120px;height:120px;transform:rotate(-14deg)">${icon('white', 120)}</div><div class="abs" id="eR" style="left:20px;top:-140px;width:120px;height:120px;transform:rotate(12deg)">${icon('white', 120)}</div><svg class="abs" style="left:-150px;top:0" width="320" height="160"><path id="sm6" d="M20 30 Q 140 150 280 20" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" fill="none"/></svg>`;
  let p = ''; for (let r = 0; r < 4; r++) for (let c = 0; c < 9; c++) p += `<div class="abs" style="left:${c * 260 + (r % 2) * 130}px;top:${r * 300 + 40}px;width:150px;height:150px;transform:scale(.55)">${$('smile6').innerHTML.replace(/id="[^"]*"/g, '')}</div>`; $('pat6').innerHTML = p;
  E.ch7 = place($('s7'), icon('chrome', 300), 960, 540, 300);
  E.ch8 = place($('s8'), icon('chrome', 210), 960, 540, 210);
  E.ch9 = place($('s9'), icon('chrome', 520), 960, 540, 520);
  E.kn10 = place($('s10'), icon('knit', 360), 960, 540, 360);
  $('row11').innerHTML = `<div style="width:420px;height:420px">${icon('black', 420)}</div><div class="lm" style="position:relative;width:1300px;height:544px;background:#111216"></div>`;
  $('nm12').innerHTML = icon('black', 60); $('nm12').style.cssText = 'position:relative;width:60px;height:60px';
}
function show(k) { for (let i = 1; i <= 12; i++) $('s' + i).style.display = i === k ? 'block' : 'none'; }
function rotY(el, a, s = 1) { el.style.transform = `perspective(1200px) rotateY(${a}deg) rotateX(${a * .15}deg) scale(${s})`; const g = el.querySelector('.chg'); if (g) g.setAttribute('gradientTransform', `rotate(${a * 1.5} .5 .5)`); }
function seek(t) {
  const keys = ['s1', 's2', 's3', 's4', 's5', 's6', 's7', 's8', 's9', 's10', 's11', 's12', 'end']; let k = 1; for (let i = 0; i < 12; i++) if (t >= C[keys[i]]) k = i + 1; show(k);
  const lt = t - C[keys[k - 1]], d = C[keys[k]] - C[keys[k - 1]];
  if (k === 1) { E.sph1.style.transform = `scale(${.6 + .4 * spr(lt * 2)}) rotate(${lt * 40}deg)`; }
  if (k === 2) { $('bg2').style.transform = `translateX(${-500 + 1000 * eio(lt / d)}px)`; E.sph2.style.transform = `scale(${1 + .3 * lt})`; }
  if (k === 3) { const p = eio(lt / .45); const s = 6 - 5 * p; E.ic3.style.transform = `translateY(${Math.sin(lt * 4) * 10}px) scale(${s}) rotate(${(1 - p) * 20}deg)`; E.ic3.style.filter = `blur(${12 * (1 - p)}px)`; E.sh3.style.opacity = p; $('fl3').style.backgroundPosition = `0 ${lt * 200}px`; }
  if (k === 4) { $('big4').style.transform = `translateX(${-lt * 900}px) scale(${1.2 - lt * .2})`; }
  if (k === 5) { const g = $('vg'); const k2 = CT.k; const p = eio(lt / d); const z = 1.05 + 2.4 * eio(cl((lt - .4) / (d - .4))); const px = 110 - (1700 * z * .42) * eio(cl((lt - .4) / (d - .4))); g.setAttribute('transform', `translate(${px} ${540 - CT.h * k2 * z / 2}) scale(${z})`);
    CT.shapes.forEach((sh, i) => { const pe = $('vp' + i); const L = pe.getTotalLength(); pe.style.strokeDasharray = L; pe.style.strokeDashoffset = L * (1 - eo((lt - i * .05) / .5)); });
    document.querySelectorAll('#vec5 .anc').forEach((r, n) => r.style.opacity = cl((lt - .2 - n * .01) / .1));
    const M = g.getCTM(); const a = CT.shapes[1].a[1]; const P = new DOMPoint(a[0] * k2 + 30, a[1] * k2 + 20).matrixTransform(M); $('cur5').style.transform = `translate(${P.x + Math.sin(lt * 3) * 30}px,${P.y + Math.cos(lt * 2) * 20}px)`; }
  if (k === 6) { // azul: logo, apaga o nome, ponto, sorriso, padrão, bolha
    const cx = 960, cy = 540; const t1 = 1.25, t2 = 2.1, t3 = 3.25, t4 = 4.75;
    const wmW = 380, wmH = wmW * 485 / 1160; const er = lt < t1 ? 0 : eio((lt - t1) / .7);
    const icS = lt < t2 ? 1 : lt < t2 + .3 ? 1 - .92 * eio((lt - t2) / .3) : 0;
    const shift = (wmW + 30) / 2 * (1 - er);
    Object.assign($('mark6').style, {left: cx - shift - 60 - 20 + 'px', top: cy - 60 + 'px', width: '120px', height: '120px', transform: `scale(${icS})`, opacity: lt < t2 + .3 ? 1 : 0});
    Object.assign($('wm6').style, {left: cx - shift + 40 + 'px', top: cy - wmH / 2 + 'px', width: wmW + 'px', height: wmH + 'px', clipPath: `inset(0 ${100 * er}% 0 0)`, opacity: er < 1 ? 1 : 0});
    const sp = lt > t2 + .3 ? spr((lt - t2 - .3) * 1.4) : 0; Object.assign($('smile6').style, {left: cx + 'px', top: cy + 'px', transform: `scale(${sp * 1.1}) rotate(${-6 + 6 * sp}deg)`, opacity: lt > t2 + .3 && lt < t3 ? 1 : 0});
    $('sm6').style.strokeDasharray = 360; $('sm6').style.strokeDashoffset = 360 * (1 - eo((lt - t2 - .45) / .4));
    $('pat6').style.opacity = lt >= t3 ? 1 : 0; $('pat6').style.transform = `translateX(${-(lt - t3) * 260}px)`;
    const b = eio((lt - t4) / .7); let path = ''; if (b > 0) { const R = 1500 * b; const pts = []; for (let i = 0; i < 64; i++) { const a = i / 64 * 6.283; const r = R * (.72 + .28 * Math.cos(4 * a + lt * 3)) * (1 + .05 * Math.sin(7 * a)); pts.push([1250 + Math.cos(a) * r, 760 + Math.sin(a) * r]); } path = `<path d="M${pts.map(p => p.join(' ')).join(' L')}Z" fill="#E6F6FF"/>`;
      const b2 = eio((lt - t4 - .3) / .5); if (b2 > 0) path += `<circle cx="1700" cy="250" r="${1600 * b2}" fill="#050506"/>`; }
    $('blob6').innerHTML = path; }
  if (k === 7) { const p = lt / d; rotY(E.ch7, -40 + 80 * eio(p), 1.15 - .25 * eio(p)); }
  if (k === 8) { rotY(E.ch8, Math.sin(lt * 1.5) * 25, 1); $('stage').style.setProperty('--z', 1);
    const pos = [['k8a', 520, 230], ['k8b', 1240, 200], ['k8c', 560, 560], ['k8d', 1220, 470], ['k8e', 330, 420]]; const z = 1 + .12 * eio(lt / d);
    pos.forEach(([id, x, y], i) => { const p = eo((lt - i * .08) / .5); const dx = (x - 960) * z + 960, dy = (y - 540) * z + 540; $(id).style.transform = `translate(${dx}px,${dy + 60 * (1 - p) + Math.sin(lt * 1.4 + i) * 8}px) scale(${z})`; $(id).style.opacity = p; });
    E.ch8.style.transform += ` scale(${z})`; }
  if (k === 9) { const p = eio(lt / d); rotY(E.ch9, -70 + 140 * p, 1); E.ch9.style.filter = `blur(${6 * Math.sin(p * Math.PI)}px)`; }
  if (k === 10) { E.kn10.style.transform = `scale(${1.15 - .15 * eo(lt / d)}) rotate(${-4 + 8 * eio(lt / d)}deg)`; }
  if (k === 11) { const p = eio(lt / d); Object.assign($('row11').style, {left: (300 - 900 * p) + 'px', top: 330 + 'px', transform: `scale(${1.25 - .15 * p})`, filter: `blur(${14 * Math.sin(p * Math.PI)}px)`}); }
  if (k === 12) { const ls = ['Inteligência pública', 'para cidades que', 'decidem com dados.']; $('h12').innerHTML = ls.map((l, i) => { const q = cl((lt - .25 - i * .22) / .45); return `<div style="opacity:${q};filter:blur(${12 * (1 - q)}px)">${l}</div>`; }).join('');
    const z = lt < 1.4 ? 1.3 - .3 * eio(lt / 1.2) : 1 + .25 * eio((lt - 1.4) / 1.2); $('site12').style.transform = `scale(${z}) translateY(${-40 * eio((lt - 1.4) / 1.2)}px)`; $('site12').style.filter = `blur(${lt > 2.2 ? 6 * eio((lt - 2.2) / .5) : 0}px)`; }
  $('fade').style.opacity = cl((t - (DUR - .5)) / .5);
}
window.seek = seek;
fetch('contours.json').then(r => r.json()).then(ct => Promise.all(['500 20px Inter', '600 20px Inter', '700 20px Inter'].map(f => document.fonts.load(f))).then(() => { const im = new Image(); im.src = '../kit/assets/nova/v47_logo_branca_transp.png'; return new Promise(r => im.onload = r); })
  .then(() => { build(ct); seek(0); window.ready = true; if (!location.search.includes('render')) { const t0 = performance.now(); const loop = () => { seek(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); }; loop(); } }));
</script>
</body>
</html>
